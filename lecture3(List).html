<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Un-Ordered List</h1>
    <ul type = "square">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ul>

    <ol type = "A">
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>

    <!-- Description List -->
    <dl>
        <dt>HTML</dt>
        <dd>HyperText Markup Language</dd>
        <dt>CSS</dt>
        <dd>Cascading Style Sheets</dd>
        <dt>JavaScript</dt>
        <dd>Programming language for web development</dd>
    </dl>


    <!-- Creating Tables -->
    <table border="1">
        <tr>
            <td>Name</td>
            <td>Roll No</td>
        </tr>
        <tr>
            <td>Mohit</td>
            <td>01</td>
        </tr>
        <tr>
            <td>Hassan</td>
            <td>11</td>
        </tr> 
        <tr>
            <td>Muhammad Zahoor</td>
            <td>81</td>
        </tr> 

     </table>


</body>
</html>
